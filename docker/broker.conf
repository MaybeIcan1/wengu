brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48
autoCreateTopicEnable = true
# 关键配置：后端跑在宿主机上，Namesrv 会把 Broker 地址返回给客户端。
# 不配这条，客户端会拿到容器内网 IP（172.x.x.x），宿主机连不上——经典大坑
brokerIP1 = 127.0.0.1
